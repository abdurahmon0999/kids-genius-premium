name: untitled
description: "Kids Genius - Premium Startup Educational Platform for Children"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  firebase_core: ^3.3.0
